Enable_fusk=Abilita offuscamento (semplice)
Enable_fusk_Explanation=Offuscamento file con PIN\: contenuto e nomi file offuscati. Adatto per utenti attenti alla sicurezza quando archiviano dati nel cloud o su supporti non crittografati (soprattutto esterni). NON UTILIZZARE per dati/immagini estremamente sensibili\!\!\!, in quanto NON \u00E8 una crittografia robusta (vedere il codice). \u00C8 sufficiente per proteggere da un utente medio che ha rubato il tuo hardware o le tue credenziali cloud. Per una maggiore sicurezza, puoi utilizzare una passphrase diversa da quella predefinita nel codice sorgente, che, insieme al codice PIN, forma la chiave di crittografia. Per farlo, nella cartella '.klikr', crea un file chiamato '.passphrase.txt' e scrivi la tua passphrase al suo interno. In tutti i casi, assicurati di salvare il codice PIN (e la passphrase se l'hai modificata), in quanto NON esiste modo (a meno che tu non sia un esperto con l'hardware e molto tempo) di recuperare i tuoi dati se l'hai dimenticato/perso.
