Enable_mmap_caching=Abilita la memorizzazione nella cache delle icone tramite mmap
Enable_mmap_caching_Explanation=Abilita mappatura in RAM per file\: accelera la cache delle icone... Inoltre, Klikr mappa i pixel grezzi, il che \u00E8 ancora pi\u00F9 veloce, ma richiede pi\u00F9 spazio su disco rispetto ai file normali. Nota che la RAM utilizzata non fa parte del 'max RAM' del JVM.
